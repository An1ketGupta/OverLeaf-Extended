# Optional local PostgreSQL; a native installation or Neon also works.
# These credentials are for localhost development only.
services:
  mailpit:
    image: axllent/mailpit:v1.32.0
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    environment:
      MP_DISABLE_VERSION_CHECK: "true"
      MP_QUIET: "true"
  postgres:
    image: postgres:17.10-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: overleaf_pro
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d overleaf_pro"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres-data:
