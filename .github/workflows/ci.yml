name: Local application verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mailpit:
        image: axllent/mailpit:v1.32.0
        ports:
          - 1025:1025
          - 8025:8025
      postgres:
        image: postgres:17.10-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: overleaf_pro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/overleaf_pro
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/overleaf_pro_test
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: createdb -h 127.0.0.1 -U postgres overleaf_pro_test
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm db:migrate && pnpm db:seed
      - run: pnpm test:integration
      - run: pnpm test:recovery:integration
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm compiler:prepare
      - run: pnpm compiler:verify
      - run: pnpm build
      - run: pnpm test:templates
      - run: >-
          pnpm test:e2e --grep-invert "catalog .*: real PDF text"
      - run: pnpm test:e2e:built tests/e2e/templates.spec.ts tests/e2e/compiler.spec.ts tests/e2e/assistant-compiler.spec.ts tests/e2e/recovery.spec.ts tests/e2e/late-worker.spec.ts tests/e2e/database-recovery.spec.ts tests/e2e/report-limits.spec.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-results
          include-hidden-files: true
          # Traces can contain downloaded third-party compiler binaries. Keep
          # those local until redistribution requirements are satisfied.
          path: |
            test-results/**/*.png
            test-results/**/*.pdf
            test-results/**/error-context.md
            .cache/production-results/**/*.png
            .cache/production-results/**/*.pdf
            .cache/production-results/**/error-context.md
